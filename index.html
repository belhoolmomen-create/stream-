<!DOCTYPE html>

<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* جعل خلفية الصفحة شفافة تماماً لبرامج البث */
body { background: transparent; height: 100vh; overflow: hidden; font-family: 'Cairo', sans-serif; }

.box { 
    position: fixed; 
    bottom: 35px; 
    right: 35px; 
    display: flex; 
    align-items: center; 
    gap: 16px; 
    padding: 10px 20px; 
    animation: popInAndOut 4s cubic-bezier(0.1, 1, 0.1, 1) infinite;
}

@keyframes popInAndOut {
    0% { transform: translateX(120px) scale(0.8); opacity: 0; filter: blur(10px); }
    10% { transform: translateX(0) scale(1); opacity: 1; filter: blur(0px); }
    80% { transform: translateX(0) scale(1); opacity: 1; filter: blur(0px); }
    100% { transform: translateX(-40px) scale(1.1); opacity: 0; filter: blur(15px); }
}

.icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite alternate; }
.icon svg { width: 30px; height: 30px; fill: #fff; z-index: 2; }
.info { display: flex; flex-direction: column; text-align: right; }
.p-name { font-size: 10px; letter-spacing: 1.5px; color: #ccc; font-weight: 700; }
.usr { font-size: 18px; font-weight: 900; color: #fff; font-family: 'Orbitron', sans-serif; }

@keyframes pulse { 
    0% { transform: scale(1); filter: brightness(1); } 
    100% { transform: scale(1.08); filter: brightness(1.4); } 
}

.tg .icon { background: #0088cc; box-shadow: 0 0 25px #0088cc, 0 0 50px #0088cc; } 
.tg .usr { text-shadow: 0 0 15px #0088cc, 0 0 30px #0088cc; }

.ig .icon { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5950 45%, #c62368 60%); box-shadow: 0 0 25px #e1306c, 0 0 50px #e1306c; } 
.ig .usr { text-shadow: 0 0 15px #e1306c, 0 0 30px #e1306c; }

.tk .icon { background: #010101; border: 2px solid #fe2f55; box-shadow: 0 0 25px #25f4ee, 0 0 50px #25f4ee; } 
.tk .usr { text-shadow: 0 0 15px #25f4ee, 0 0 30px #25f4ee; }

.yt .icon { background: #ff0000; box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000; } 
.yt .usr { text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000; }

.fb .icon { background: #1877f2; box-shadow: 0 0 25px #1877f2, 0 0 50px #1877f2; } 
.fb .usr { text-shadow: 0 0 15px #1877f2, 0 0 30px #1877f2; }
</style>
